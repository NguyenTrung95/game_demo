<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>Sumo Tug of War — Host</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400..700&display=swap');
  
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    font-family: 'Fredoka', -apple-system, sans-serif;
    background: radial-gradient(circle at 50% 30%, #bae6fd, #e0f2fe);
    color: #4b5563; overflow: hidden;
    position: relative;
  }
  
  /* Cloud background decorations */
  .cloud-decor {
    position: absolute;
    background: white;
    border-radius: 100px;
    opacity: 0.8;
    pointer-events: none;
    z-index: 0;
    box-shadow: 0 8px 24px rgba(255,255,255,0.4);
  }
  .cloud-1 {
    width: 140px; height: 45px; top: 8%; left: 10%;
    animation: drift 35s linear infinite alternate;
  }
  .cloud-2 {
    width: 200px; height: 60px; top: 15%; right: 15%;
    animation: drift 50s linear infinite alternate-reverse;
  }
  .cloud-3 {
    width: 100px; height: 35px; top: 25%; left: 45%;
    animation: drift 25s linear infinite alternate;
  }
  @keyframes drift {
    0% { transform: translateX(-40px); }
    100% { transform: translateX(40px); }
  }

  /* Camera flashes in the background */
  .camera-flashes {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 1;
  }
  .flash-dot {
    position: absolute;
    width: 6px; height: 6px;
    background: #fff;
    border-radius: 50%;
    opacity: 0;
    box-shadow: 0 0 10px 4px #fff, 0 0 20px 8px #fff;
  }
  
  .wrapper {
    height: 100vh; width: 100vw;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 20px; text-align: center;
    position: relative;
    z-index: 2;
  }
  
  .card {
    width: 100%; max-width: 900px;
    background: #fffdf0;
    border: 6px solid #854d0e;
    border-radius: 36px;
    padding: 24px 32px;
    box-shadow: 0 16px 0 #451a03, 0 24px 50px rgba(0,0,0,0.15);
    position: relative;
  }

  .game-badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: #fef08a; color: #854d0e;
    border: 3px solid #ca8a04;
    font-size: 12px; font-weight: 700; letter-spacing: 0.02em;
    padding: 4px 14px; border-radius: 999px; margin-bottom: 12px;
    text-transform: uppercase;
    box-shadow: 0 3px 0 #ca8a04;
  }
  
  h1 {
    font-size: 40px; margin: 0 0 16px; font-weight: 800;
    color: #b45309;
    text-shadow: 0 3px 0 #fef08a, 0 4.5px 0 #b45309;
    letter-spacing: -0.01em;
    animation: titleBounce 1.5s ease-in-out infinite alternate;
  }
  @keyframes titleBounce {
    0% { transform: translateY(0); }
    100% { transform: translateY(-4px); }
  }

  /* Split Lobby Grid Layout */
  #lobby-grid {
    display: flex;
    gap: 24px;
    align-items: stretch;
    justify-content: center;
    margin-bottom: 16px;
    text-align: center;
  }
  .lobby-col-left {
    flex: 1;
    max-width: 300px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(133, 77, 14, 0.03);
    border: 3.5px dashed #ca8a04;
    border-radius: 24px;
    padding: 16px;
  }
  .lobby-col-right {
    flex: 1.3;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  #qr-image {
    width: 170px; height: 170px; background: #fff; border-radius: 20px;
    padding: 10px; margin-bottom: 12px;
    border: 4px solid #854d0e;
    box-shadow: 0 6px 0 #854d0e, 0 8px 16px rgba(0,0,0,0.08);
  }
  
  #pin-fallback {
    font-size: 14px; color: #854d0e; font-weight: 700; margin-bottom: 12px;
    letter-spacing: 0.04em;
    opacity: 0.8;
  }

  button.action-btn {
    font-size: 15px; padding: 10px 22px; border-radius: 999px; border: none;
    cursor: pointer; font-weight: 700; transition: transform 0.1s, box-shadow 0.1s;
    font-family: 'Fredoka', sans-serif;
  }
  button.action-btn:active { transform: scale(0.96) translateY(2px); }

  /* ============================
     START BUTTON — 2 States
     ============================ */
  #btn-force-start {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 17px;
    padding: 14px 28px;
    width: 100%;
    margin: 0;
    border-radius: 14px;
    font-family: 'Fredoka', sans-serif;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.2s, background 0.3s;
    overflow: hidden;
  }

  /* DISABLED — No players joined yet */
  #btn-force-start:disabled {
    background: rgba(255,255,255,0.05);
    border: 2.5px solid rgba(255,255,255,0.12);
    color: rgba(255,255,255,0.3);
    box-shadow: none;
    cursor: not-allowed;
    transform: none !important;
    animation: none !important;
  }

  /* ENABLED — Players have joined */
  #btn-force-start:not(:disabled) {
    background: linear-gradient(135deg, #22c55e, #16a34a);
    border: 2.5px solid #4ade80;
    color: #fff;
    box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7),
                0 6px 0 #15803d,
                0 10px 24px rgba(34, 197, 94, 0.3);
    animation: startBtnGlow 2s ease-in-out infinite;
  }
  #btn-force-start:not(:disabled):hover {
    background: linear-gradient(135deg, #4ade80, #22c55e);
    transform: translateY(-2px) scale(1.03);
  }
  #btn-force-start:not(:disabled):active {
    transform: translateY(1px) scale(0.97);
    box-shadow: 0 2px 0 #15803d, 0 4px 12px rgba(34,197,94,0.2);
  }

  @keyframes startBtnGlow {
    0%   { box-shadow: 0 0 0 0 rgba(34,197,94,0.7), 0 6px 0 #15803d, 0 10px 24px rgba(34,197,94,0.3); }
    50%  { box-shadow: 0 0 0 10px rgba(34,197,94,0), 0 6px 0 #15803d, 0 12px 32px rgba(34,197,94,0.5); }
    100% { box-shadow: 0 0 0 0 rgba(34,197,94,0),   0 6px 0 #15803d, 0 10px 24px rgba(34,197,94,0.3); }
  }

  /* Highlight ring — always visible on the button container */
  .start-btn-wrap {
    position: relative;
    width: 100%;
    padding: 4px;
    border-radius: 18px;
    background: linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
    margin-top: 8px;
  }
  .start-btn-wrap::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 18px;
    padding: 2px;
    background: linear-gradient(135deg, rgba(255,255,255,0.25), rgba(255,255,255,0.05));
    mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    mask-composite: exclude;
    pointer-events: none;
  }

  /* Hint text below button */
  #start-btn-hint {
    font-size: 11px;
    color: rgba(255,255,255,0.4);
    text-align: center;
    margin-top: 6px;
    letter-spacing: 0.03em;
    transition: color 0.3s;
  }
  #start-btn-hint.ready {
    color: rgba(134, 239, 172, 0.85);
  }

  @keyframes focusPulse {
    0% { outline-color: #b45309; box-shadow: 0 0 12px rgba(180, 83, 9, 0.5); }
    50% { outline-color: #eab308; box-shadow: 0 0 24px rgba(234, 179, 8, 0.8); }
    100% { outline-color: #ef4444; box-shadow: 0 0 12px rgba(239, 68, 68, 0.5); }
  }

  button.action-btn:focus {
    outline: 5px solid #b45309;
    animation: focusPulse 2s infinite ease-in-out;
    transform: scale(1.06) !important;
    z-index: 10;
  }
  /* Audio Control */
  .header-actions {
    position: absolute; top: 24px; right: 32px;
    display: flex; gap: 12px; z-index: 10;
  }
  #audio-toggle {
    background: #fffdf0; color: #854d0e;
    border: 3.5px solid #854d0e;
    box-shadow: 0 4px 0 #854d0e;
    border-radius: 50%; width: 44px; height: 44px;
    font-size: 20px; display: flex; align-items: center; justify-content: center;
    padding: 0;
  }
  #audio-toggle:active { transform: translateY(2px); box-shadow: 0 2px 0 #854d0e; }

  /* Lobby Teams list */
  .lobby-pool-container {
    background: rgba(133, 77, 14, 0.05);
    border: 3.5px solid #ca8a04;
    border-radius: 24px;
    padding: 16px;
    height: 250px;
    display: flex;
    gap: 16px;
  }
  .lobby-team-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    border-radius: 16px;
    padding: 8px;
    background: #fff;
    border: 2px solid rgba(133, 77, 14, 0.1);
  }
  .lobby-team-col.red { border-color: #fecaca; }
  .lobby-team-col.blue { border-color: #bfdbfe; }
  
  .lobby-team-title {
    font-size: 16px;
    font-weight: 800;
    margin-bottom: 8px;
    padding: 4px 8px;
    border-radius: 8px;
    text-align: center;
  }
  .lobby-team-title.red { background-color: #fee2e2; color: #ef4444; }
  .lobby-team-title.blue { background-color: #dbeafe; color: #3b82f6; }

  .lobby-team-list {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-wrap: wrap;
    align-content: flex-start;
    gap: 8px;
    padding: 4px;
  }
  .lobby-player-duck {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: #f7fee7;
    border: 2px solid #84cc16;
    border-radius: 999px;
    padding: 3px 10px;
    font-size: 12px;
    font-weight: 700;
    box-shadow: 0 2px 0 #84cc16;
    animation: popIn 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
  }
  .lobby-player-duck.red {
    background: #fff5f5;
    border-color: #fca5a5;
    box-shadow: 0 2px 0 #fca5a5;
  }
  .lobby-player-duck.blue {
    background: #f0f7ff;
    border-color: #93c5fd;
    box-shadow: 0 2px 0 #93c5fd;
  }
  .lobby-player-duck svg { width: 18px; height: 18px; }
  @keyframes popIn {
    0% { transform: scale(0.6); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  /* Racetrack View (The Arena) */
  #race-content {
    display: none;
    width: 100%;
    flex-direction: column;
    align-items: center;
    position: relative;
  }
  
  /* Arena Scoreboard */
  .arena-scoreboard {
    width: 100%;
    max-width: 650px;
    background: #fffbeb;
    border: 4.5px solid #854d0e;
    border-radius: 20px;
    padding: 8px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 8px 0 #854d0e;
    margin-bottom: 24px;
    z-index: 10;
  }
  .scoreboard-team {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .scoreboard-team-name {
    font-size: 16px; font-weight: 800;
  }
  .scoreboard-team-name.red { color: #ef4444; }
  .scoreboard-team-name.blue { color: #3b82f6; }
  
  .scoreboard-taps-count {
    font-size: 32px; font-weight: 800;
  }
  .scoreboard-taps-count.red { color: #b91c1c; text-shadow: 0 2px 0 #fca5a5; }
  .scoreboard-taps-count.blue { color: #1d4ed8; text-shadow: 0 2px 0 #93c5fd; }
  
  .scoreboard-center-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .scoreboard-timer-title {
    font-size: 11px; font-weight: 800; text-transform: uppercase; opacity: 0.6;
  }
  .scoreboard-timer {
    font-size: 28px; font-weight: 900; color: #ef4444;
  }

  /* Rope Arena */
  .rope-arena-container {
    width: 100%;
    height: 180px;
    background: linear-gradient(180deg, #d9f99d, #a3e635);
    border: 5px solid #854d0e;
    border-radius: 28px;
    box-shadow: inset 0 8px 12px rgba(0,0,0,0.15), 0 6px 0 #854d0e;
    position: relative;
    overflow: hidden;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
  }
  .stadium-lines {
    position: absolute;
    inset: 0;
    background-image: 
      linear-gradient(90deg, transparent 50%, rgba(255,255,255,0.4) 50%, rgba(255,255,255,0.4) 50.5%, transparent 50.5%),
      linear-gradient(90deg, rgba(255,255,255,0.25) 15%, transparent 15%, transparent 85%, rgba(255,255,255,0.25) 85%);
    background-size: 100% 100%;
    pointer-events: none;
  }
  .win-flag {
    position: absolute;
    bottom: 12px;
    font-size: 24px;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
  }
  .win-flag.red { left: 14%; }
  .win-flag.blue { right: 14%; }

  /* The actual Rope */
  .arena-rope-wrapper {
    position: absolute;
    left: 10%; right: 10%;
    height: 30px;
    display: flex;
    align-items: center;
  }
  .arena-rope {
    width: 100%;
    height: 14px;
    background: repeating-linear-gradient(
      -45deg,
      #d97706,
      #d97706 10px,
      #b45309 10px,
      #b45309 20px
    );
    border-radius: 6px;
    border: 2px solid #78350f;
    box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    position: relative;
  }
  .arena-rope.shaking {
    animation: ropeShake 0.15s linear infinite;
  }
  @keyframes ropeShake {
    0% { transform: translateY(-1.5px) rotate(0.5deg); }
    50% { transform: translateY(1.5px) rotate(-0.5deg); }
    100% { transform: translateY(-1.5px) rotate(0.5deg); }
  }

  .arena-rope-ribbon {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 28px;
    height: 28px;
    background: #e11d48;
    border: 3.5px solid #fffdf0;
    border-radius: 4px;
    transform: translate(-50%, -50%) rotate(45deg);
    box-shadow: 0 4px 8px rgba(0,0,0,0.25);
    z-index: 5;
    transition: left 0.2s cubic-bezier(0.18, 0.89, 0.32, 1.28);
  }
  .arena-rope-ribbon::after {
    content: '';
    position: absolute;
    inset: -6px;
    border: 2px dashed #facc15;
    border-radius: 6px;
  }

  /* Mascot Sumos Pulling */
  .arena-mascot {
    position: absolute;
    top: -25px; 
    width: 85px;
    height: 85px;
    z-index: 4;
    transition: transform 0.2s cubic-bezier(0.18, 0.89, 0.32, 1.28);
  }
  .arena-mascot.red-mascot {
    left: calc(10% - 70px);
  }
  .arena-mascot.blue-mascot {
    right: calc(10% - 70px);
  }
  
  /* Sumo Pull Animations starting from current displacement */
  .arena-mascot.red-mascot.pulling {
    animation: sumoPullRed 0.2s ease-out;
  }
  .arena-mascot.blue-mascot.pulling {
    animation: sumoPullBlue 0.2s ease-out;
  }
  @keyframes sumoPullRed {
    0% { transform: var(--mascot-trans, translateX(0px)) scale(1) rotate(0deg); }
    50% { transform: var(--mascot-trans, translateX(0px)) translateX(-15px) scale(1.08, 0.92) rotate(-8deg); }
    100% { transform: var(--mascot-trans, translateX(0px)) scale(1) rotate(0deg); }
  }
  @keyframes sumoPullBlue {
    0% { transform: var(--mascot-trans, translateX(0px)) scale(1) rotate(0deg); }
    50% { transform: var(--mascot-trans, translateX(0px)) translateX(15px) scale(1.08, 0.92) rotate(8deg); }
    100% { transform: var(--mascot-trans, translateX(0px)) scale(1) rotate(0deg); }
  }
  
  .sumo-svg {
    width: 100%; height: 100%;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.25));
  }

  /* Dust Particles */
  .dust-cloud {
    position: fixed;
    pointer-events: none;
    z-index: 3;
    border-radius: 50%;
    background: #cbd5e1;
    opacity: 0.8;
  }

  /* Team Breakdowns in Arena */
  .arena-teams-breakdown {
    width: 100%;
    display: flex;
    gap: 20px;
    height: 170px;
  }
  .arena-team-card {
    flex: 1;
    background: #fffdf0;
    border: 4px solid #854d0e;
    border-radius: 20px;
    padding: 10px 16px;
    box-shadow: 0 8px 0 #854d0e;
    display: flex;
    flex-direction: column;
  }
  .arena-team-card-title {
    font-size: 15px; font-weight: 800; margin-bottom: 6px;
  }
  .arena-team-card-title.red { color: #ef4444; }
  .arena-team-card-title.blue { color: #3b82f6; }
  
  .arena-team-scroll-list {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  
  .arena-player-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(133, 77, 14, 0.04);
    border-radius: 8px;
    padding: 4px 8px;
    font-size: 13px;
    font-weight: 700;
  }
  .arena-player-row.red-row { border-left: 4.5px solid #ef4444; }
  .arena-player-row.blue-row { border-left: 4.5px solid #3b82f6; }
  .arena-player-row.mvp {
    background: #fef08a;
    border-color: #eab308;
    box-shadow: 0 0 8px rgba(234, 179, 8, 0.3);
  }
  .arena-player-name {
    display: inline-flex; align-items: center; gap: 4px;
    color: #4b5563;
  }
  .arena-player-name svg { width: 18px; height: 18px; }
  .arena-player-taps {
    font-weight: 800;
  }
  .arena-player-taps.red { color: #b91c1c; }
  .arena-player-taps.blue { color: #1d4ed8; }

  /* Winner Overlay / Fanfare */
  #winner-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 999;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
    animation: fadeInOverlay 0.3s ease-out forwards;
  }
  @keyframes fadeInOverlay {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .winner-card {
    background: #fffdf0;
    border: 7px solid #854d0e;
    border-radius: 40px;
    padding: 32px 48px;
    box-shadow: 0 20px 0 #451a03, 0 30px 60px rgba(0,0,0,0.3);
    width: 90%;
    max-width: 680px;
    text-align: center;
    position: relative;
    transform: scale(0.9);
    animation: popWinnerCard 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
  }
  @keyframes popWinnerCard {
    to { transform: scale(1); }
  }

  .winner-title {
    font-size: 34px; margin: 0 0 16px; font-weight: 900;
    color: #b45309; text-shadow: 0 3px 0 #fef08a;
  }
  
  .team-victory-banner {
    font-size: 42px;
    font-weight: 900;
    padding: 12px 24px;
    border-radius: 24px;
    border: 5px solid #854d0e;
    box-shadow: 0 8px 0 #854d0e;
    margin-bottom: 24px;
    text-transform: uppercase;
    animation: bannerPulse 0.5s ease-in-out infinite alternate;
  }
  .team-victory-banner.red {
    background: linear-gradient(135deg, #fca5a5, #ef4444);
    color: #fff;
    text-shadow: 0 3px 0 #991b1b;
  }
  .team-victory-banner.blue {
    background: linear-gradient(135deg, #93c5fd, #3b82f6);
    color: #fff;
    text-shadow: 0 3px 0 #1e40af;
  }
  .team-victory-banner.tie {
    background: linear-gradient(135deg, #fef08a, #ca8a04);
    color: #854d0e;
    text-shadow: 0 3px 0 #fff;
  }
  @keyframes bannerPulse {
    0% { transform: scale(0.97); }
    100% { transform: scale(1.03); }
  }

  /* Winner Podiums */
  .podium-container {
    display: flex;
    justify-content: center;
    align-items: flex-end;
    margin: 24px 0;
    height: 160px;
    gap: 16px;
  }
  .podium-step {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
  }
  .podium-duck-slot { width: 56px; height: 56px; }
  .podium-block {
    width: 100%;
    color: #fff;
    font-size: 24px;
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 3.5px solid #854d0e;
    border-radius: 12px 12px 0 0;
    box-shadow: inset 0 4px 0 rgba(255,255,255,0.25);
  }
  .step-1 .podium-block { height: 75px; background: #eab308; }
  .step-2 .podium-block { height: 50px; background: #94a3b8; }
  .step-3 .podium-block { height: 35px; background: #b45309; }

  .podium-crown {
    position: absolute;
    top: -16px;
    font-size: 24px;
    animation: crownFloat 0.5s ease-in-out infinite alternate;
  }
  @keyframes crownFloat {
    0% { transform: translateY(0) rotate(-5deg); }
    100% { transform: translateY(-4px) rotate(5deg); }
  }

  .podium-name {
    font-size: 14px; font-weight: 800; color: #854d0e; margin-top: 6px;
    max-width: 100px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  .restart-timer-line {
    font-size: 15px; font-weight: 800; color: #ca8a04; margin-top: 16px;
    letter-spacing: 0.02em;
  }

  /* Confetti particle style */
  .confetti-particle {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
  }
</style>
</head>
<body>

<div class="cloud-decor cloud-1"></div>
<div class="cloud-decor cloud-2"></div>
<div class="cloud-decor cloud-3"></div>

<!-- Background camera flashes simulator container -->
<div class="camera-flashes" id="camera-flashes"></div>

<div class="header-actions">
  <button id="audio-toggle" title="Toggle Audio">🔊</button>
</div>

<div class="wrapper">
  <div class="card">
    <span class="game-badge">💪 Sumo Power Battle</span>
    <h1 id="game-title">SUMO TUG OF WAR</h1>
    
    <!-- Lobby View Content -->
    <div id="lobby-content">
      <div id="lobby-grid">
        <div class="lobby-col-left">
          <img id="qr-image" src="" alt="QR Code">
          <div id="pin-fallback">PIN Code: ----</div>
        </div>

        <div class="lobby-col-right">
          <div class="lobby-pool-container">
            <div class="lobby-team-col red">
              <div class="lobby-team-title red">🔴 RED TEAM</div>
              <div id="lobby-team-list-red" class="lobby-team-list">
                <!-- Players will pop in here -->
              </div>
            </div>
            
            <div class="lobby-team-col blue">
              <div class="lobby-team-title blue">🔵 BLUE TEAM</div>
              <div id="lobby-team-list-blue" class="lobby-team-list">
                <!-- Players will pop in here -->
              </div>
            </div>
          </div>
          
          <div class="start-btn-wrap">
            <button class="action-btn" id="btn-force-start" disabled>
              <span id="start-btn-icon">🔒</span>
              <span id="start-btn-label">Start Game Now</span>
            </button>
          </div>
          <div id="start-btn-hint">Waiting for players to join...</div>
        </div>
      </div>
    </div>

    <!-- Racetrack View (The Arena) -->
    <div id="race-content">
      <div class="arena-scoreboard">
        <div class="scoreboard-team">
          <span class="scoreboard-team-name red">RED TEAM</span>
          <span id="scoreboard-taps-red" class="scoreboard-taps-count red">0</span>
        </div>
        <div class="scoreboard-center-wrap">
          <span class="scoreboard-timer-title">Time Remaining</span>
          <span id="race-timer-display" class="scoreboard-timer">30s</span>
        </div>
        <div class="scoreboard-team">
          <span class="scoreboard-team-name blue">BLUE TEAM</span>
          <span id="scoreboard-taps-blue" class="scoreboard-taps-count blue">0</span>
        </div>
      </div>

      <div class="rope-arena-container">
        <div class="stadium-lines"></div>
        <div class="win-flag red">🚩</div>
        <div class="win-flag blue">🚩</div>
        
        <!-- The Rope -->
        <div class="arena-rope-wrapper">
          <div id="arena-mascot-red" class="arena-mascot red-mascot">
            <!-- Sumo Mascot left -->
          </div>
          
          <div id="arena-rope" class="arena-rope">
            <div id="arena-rope-ribbon" class="arena-rope-ribbon"></div>
          </div>
          
          <div id="arena-mascot-blue" class="arena-mascot blue-mascot">
            <!-- Sumo Mascot right -->
          </div>
        </div>
      </div>

      <div class="arena-teams-breakdown">
        <!-- Red team lists -->
        <div class="arena-team-card" style="border-color: #fca5a5;">
          <div class="arena-team-card-title red">🔴 RED TEAM PLAYERS:</div>
          <div id="arena-team-list-red" class="arena-team-scroll-list"></div>
        </div>
        <!-- Blue team lists -->
        <div class="arena-team-card" style="border-color: #93c5fd;">
          <div class="arena-team-card-title blue">🔵 BLUE TEAM PLAYERS:</div>
          <div id="arena-team-list-blue" class="arena-team-scroll-list"></div>
        </div>
      </div>
    </div>

    <div id="status-line" class="lobby">⏳ Initializing room...</div>
  </div>
</div>

<script>
(function () {
  var socket = null;
  var lobbyDeadline = null;
  var lobbyCountdownTimer = null;
  var targetNetTaps = 50;
  var lobbyPlayers = [];

  var audioCtx = null;
  var audioEnabled = true;

  function getAudioCtx() {
    if (!audioCtx) {
      var AudioContext = window.AudioContext || window.webkitAudioContext;
      if (AudioContext) audioCtx = new AudioContext();
    }
    return audioCtx;
  }

  function toggleAudio() {
    var ctx = getAudioCtx();
    if (!ctx) return;
    if (ctx.state === 'suspended') {
      ctx.resume().then(updateAudioButtonState);
    } else {
      audioEnabled = !audioEnabled;
      updateAudioButtonState();
    }
  }

  function updateAudioButtonState() {
    var btn = document.getElementById('audio-toggle');
    if (!btn) return;
    btn.textContent = audioEnabled ? '🔊' : '🔇';
    btn.style.borderColor = audioEnabled ? '#854d0e' : '#991b1b';
    btn.style.color = audioEnabled ? '#854d0e' : '#991b1b';
  }

  document.addEventListener('click', function() {
    var ctx = getAudioCtx();
    if (ctx && ctx.state === 'suspended') ctx.resume();
  });

  document.getElementById('audio-toggle').addEventListener('click', function(e) {
    e.stopPropagation();
    toggleAudio();
  });

  function playSound(freq, duration, type) {
    if (!audioEnabled) return;
    try {
      var ctx = getAudioCtx();
      if (!ctx) return;
      if (ctx.state === 'suspended') ctx.resume();
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      gain.gain.setValueAtTime(0.08, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration);
    } catch (e) {}
  }

  function playCountdownBeep() { playSound(600, 0.15, 'sine'); }
  function playGoBeep() { playSound(900, 0.4, 'triangle'); }
  
  function playFanfare() {
    if (!audioEnabled) return;
    try {
      var ctx = getAudioCtx();
      if (!ctx) return;
      var now = ctx.currentTime;
      var notes = [261.63, 329.63, 392.00, 523.25];
      notes.forEach(function(freq, index) {
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(freq, now + index * 0.12);
        gain.gain.setValueAtTime(0.0, now);
        gain.gain.linearRampToValueAtTime(0.06, now + index * 0.12 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, now + index * 0.12 + 0.6);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now + index * 0.12);
        osc.stop(now + index * 0.12 + 0.6);
      });
    } catch (e) {}
  }

  // Get Sumo wrestler SVG design
  function getSumoSvg(color, faceLeft) {
    var transform = faceLeft ? 'transform="scale(-1, 1) translate(-80, 0)"' : '';
    return '<svg class="sumo-svg" viewBox="0 0 80 80" width="85" height="85" ' + transform + '>' +
      // Topknot hair (Chonmage)
      '<path d="M 40,5 C 38,1 32,1 32,5 C 32,9 38,9 40,5 Z" fill="#1e293b"></path>' +
      '<circle cx="36" cy="11" r="9" fill="#1e293b"></circle>' +
      // Sumo Body/Skin (Warm skin tone)
      '<circle cx="36" cy="38" r="24" fill="#fed7aa" stroke="#f97316" stroke-width="1.5"></circle>' + 
      '<circle cx="36" cy="20" r="11" fill="#fed7aa" stroke="#f97316" stroke-width="1.5"></circle>' + 
      // Face details
      '<path d="M 31,19 C 32,18 34,18 35,19" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round"></path>' +
      '<path d="M 41,19 C 42,18 44,18 45,19" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round"></path>' +
      '<circle cx="29" cy="22" r="2.5" fill="#fca5a5" opacity="0.6"></circle>' +
      '<circle cx="43" cy="22" r="2.5" fill="#fca5a5" opacity="0.6"></circle>' +
      '<path d="M 34,24 Q 36,28 38,24 Z" fill="#991b1b" stroke="#1e293b" stroke-width="1"></path>' +
      // Mawashi Sumo belt
      '<path d="M 14,44 Q 36,54 58,44 Q 50,56 22,56 Z" fill="' + color + '" stroke="#1e293b" stroke-width="1.5"></path>' +
      '<rect x="31" y="47" width="10" height="15" fill="' + color + '" stroke="#1e293b" stroke-width="1.5" rx="2"></rect>' +
      // Arms pulling
      '<path d="M 42,28 C 50,28 58,34 56,38 C 54,42 46,36 42,32 Z" fill="#fed7aa" stroke="#f97316" stroke-width="1.5"></path>' +
      '<path d="M 28,28 C 20,28 12,34 14,38 C 16,42 24,36 28,32 Z" fill="#fed7aa" stroke="#f97316" stroke-width="1.5"></path>' +
      // Legs squatting
      '<path d="M 18,54 C 14,56 12,62 16,66 C 20,68 22,62 22,56 Z" fill="#fed7aa" stroke="#f97316" stroke-width="1.5"></path>' +
      '<path d="M 54,54 C 58,56 60,62 56,66 C 52,68 50,62 50,56 Z" fill="#fed7aa" stroke="#f97316" stroke-width="1.5"></path>' +
      '</svg>';
  }

  function connect() {
    var protocol = location.protocol === 'https:' ? 'wss' : 'ws';
    socket = new WebSocket(protocol + '://' + location.host + '/tug-of-war-ws');
    
    socket.addEventListener('open', function () { send('create_room'); });
    socket.addEventListener('message', function (event) {
      var message = JSON.parse(event.data);
      handleMessage(message.type, message.payload);
    });
    socket.addEventListener('close', function () {
      document.getElementById('status-line').textContent = 'Server disconnected. Please reload page.';
    });
  }

  function send(type, payload) {
    socket.send(JSON.stringify({ type: type, payload: payload || {} }));
  }

  function handleMessage(type, payload) {
    switch (type) {
      case 'room_created':
        onRoomCreated(payload);
        break;
      case 'room_stats':
        onRoomStats(payload);
        break;
      case 'lobby_players_update':
        onLobbyPlayersUpdate(payload);
        break;
      case 'race_start':
        onRaceStart(payload);
        break;
      case 'race_progress':
        onRaceProgress(payload);
        break;
      case 'race_over':
        onRaceOver(payload);
        break;
      default:
        break;
    }
  }

  function onRoomCreated(payload) {
    lobbyPlayers = [];
    targetNetTaps = payload.targetNetTaps || targetNetTaps;
    
    document.getElementById('qr-image').src = payload.qrDataUrl;
    document.getElementById('pin-fallback').textContent = 'PIN Code: ' + payload.pin;

    document.getElementById('lobby-content').style.display = 'block';
    document.getElementById('race-content').style.display = 'none';
    document.getElementById('btn-force-start').style.display = 'flex';

    // Always focus the start button so it has highlight ring from the start
    setTimeout(function() {
      document.getElementById('btn-force-start').focus();
    }, 300);
    
    // Hide winner overlay
    var overlay = document.getElementById('winner-overlay');
    if (overlay) overlay.style.display = 'none';

    // Clear lobby pools
    document.getElementById('lobby-team-list-red').innerHTML = '';
    document.getElementById('lobby-team-list-blue').innerHTML = '';

    // Initialize Sumo mascots (Red faces right, Blue faces left)
    document.getElementById('arena-mascot-red').innerHTML = getSumoSvg('#ef4444', false); 
    document.getElementById('arena-mascot-blue').innerHTML = getSumoSvg('#3b82f6', true); 

    renderLobbyStatusLine();
    initCameraFlashes();
  }

  function onRoomStats(payload) {
    var startBtn = document.getElementById('btn-force-start');
    var startHint = document.getElementById('start-btn-hint');
    var startIcon = document.getElementById('start-btn-icon');
    if (payload.phase !== 'lobby') {
      startBtn.style.display = 'none';
      return;
    }
    var canStart = payload.connectedCount > 0;
    var justBecameEnabled = canStart && startBtn.disabled;
    startBtn.disabled = !canStart;
    // Update icon, hint text based on state
    if (canStart) {
      startIcon.textContent = '▶';
      startHint.textContent = payload.connectedCount + ' players ready — Press to start!';
      startHint.className = 'ready';
    } else {
      startIcon.textContent = '🔒';
      startHint.textContent = 'Waiting for players to join...';
      startHint.className = '';
    }
    if (justBecameEnabled) startBtn.focus();
  }

  function onLobbyPlayersUpdate(payload) {
    lobbyPlayers = payload.players || [];
    
    var redPool = document.getElementById('lobby-team-list-red');
    var bluePool = document.getElementById('lobby-team-list-blue');
    
    if (redPool) redPool.innerHTML = '';
    if (bluePool) bluePool.innerHTML = '';
    
    lobbyPlayers.forEach(function (player) {
      var pool = player.team === 'red' ? redPool : bluePool;
      if (!pool) return;
      
      var playerEl = document.createElement('div');
      playerEl.className = 'lobby-player-duck ' + player.team;
      playerEl.setAttribute('id', 'lobby-player-' + player.playerId);
      playerEl.innerHTML = getSumoSvg(player.color, player.team === 'blue') + ' ' + player.nickname;
      pool.appendChild(playerEl);
    });
    
    renderLobbyStatusLine();
  }

  function onRaceStart(payload) {
    clearInterval(lobbyCountdownTimer);
    targetNetTaps = payload.targetNetTaps || targetNetTaps;
    
    document.getElementById('lobby-content').style.display = 'none';
    document.getElementById('race-content').style.display = 'flex';
    
    // Reset scoreboard
    document.getElementById('scoreboard-taps-red').textContent = '0';
    document.getElementById('scoreboard-taps-blue').textContent = '0';
    document.getElementById('arena-rope-ribbon').style.left = '50%';
    document.getElementById('race-timer-display').textContent = '30s';
    
    // Clear pulling classes
    document.getElementById('arena-mascot-red').className = 'arena-mascot red-mascot';
    document.getElementById('arena-mascot-blue').className = 'arena-mascot blue-mascot';
    document.getElementById('arena-rope').className = 'arena-rope';

    // Set initial custom properties for transform coordinates
    document.getElementById('arena-mascot-red').style.setProperty('--mascot-trans', 'translateX(0px)');
    document.getElementById('arena-mascot-blue').style.setProperty('--mascot-trans', 'translateX(0px)');

    // Render teams list
    renderArenaTeamLists(payload.players || []);

    playGoBeep();
    var statusEl = document.getElementById('status-line');
    statusEl.className = 'playing';
    statusEl.textContent = '🎮 TUG OF WAR! TAP AS FAST AS YOU CAN!';
  }

  function renderArenaTeamLists(players) {
    var redContainer = document.getElementById('arena-team-list-red');
    var blueContainer = document.getElementById('arena-team-list-blue');
    redContainer.innerHTML = '';
    blueContainer.innerHTML = '';

    players.forEach(function (player) {
      var row = document.createElement('div');
      row.className = 'arena-player-row ' + (player.team === 'red' ? 'red-row' : 'blue-row');
      row.setAttribute('id', 'arena-row-' + player.playerId);
      row.innerHTML = 
        '<span class="arena-player-name">' +
          getSumoSvg(player.color, player.team === 'blue') + 
          '<span>' + player.nickname + '</span>' +
        '</span>' +
        '<span class="arena-player-taps ' + player.team + '" id="arena-taps-' + player.playerId + '">0</span>';
      
      if (player.team === 'red') {
        redContainer.appendChild(row);
      } else {
        blueContainer.appendChild(row);
      }
    });
  }

  var prevRedTaps = 0;
  var prevBlueTaps = 0;

  function spawnDust(isRed) {
    var mascot = document.getElementById(isRed ? 'arena-mascot-red' : 'arena-mascot-blue');
    if (!mascot) return;
    var rect = mascot.getBoundingClientRect();
    
    var dust = document.createElement('div');
    dust.className = 'dust-cloud';
    
    // Position dust near feet
    var leftOffset = rect.left + rect.width / 2 + (Math.random() - 0.5) * 20;
    var topOffset = rect.top + rect.height + window.scrollY - 15;
    
    dust.style.left = leftOffset + 'px';
    dust.style.top = topOffset + 'px';
    dust.style.width = '8px';
    dust.style.height = '8px';
    
    document.body.appendChild(dust);
    
    // Animate dust
    var driftX = (Math.random() - 0.5) * 30 + (isRed ? -15 : 15);
    var driftY = -Math.random() * 15 - 10;
    
    dust.style.transition = 'transform 0.4s ease-out, opacity 0.4s ease-out';
    setTimeout(function() {
      dust.style.transform = 'translate(' + driftX + 'px, ' + driftY + 'px) scale(' + (Math.random() * 2 + 2) + ')';
      dust.style.opacity = '0';
      setTimeout(function() { dust.remove(); }, 400);
    }, 20);
  }

  function onRaceProgress(payload) {
    var redTaps = payload.redTaps || 0;
    var blueTaps = payload.blueTaps || 0;
    
    document.getElementById('scoreboard-taps-red').textContent = redTaps;
    document.getElementById('scoreboard-taps-blue').textContent = blueTaps;

    var remainingSec = Math.max(0, Math.ceil(payload.remainingMs / 1000));
    var statusEl = document.getElementById('status-line');
    statusEl.className = 'playing';
    statusEl.textContent = '🎮 Tug of War! — ' + remainingSec + 's left';
    document.getElementById('race-timer-display').textContent = remainingSec + 's';

    // Ribbon position
    var delta = payload.delta || 0;
    var rawPercentage = 50 + (delta / targetNetTaps) * 50;
    var boundedPercentage = Math.max(8, Math.min(92, rawPercentage));
    document.getElementById('arena-rope-ribbon').style.left = boundedPercentage + '%';

    // Displace Sumo wrestlers based on delta
    var redMascot = document.getElementById('arena-mascot-red');
    var blueMascot = document.getElementById('arena-mascot-blue');
    var rope = document.getElementById('arena-rope');

    var displacement = (delta / targetNetTaps) * 45; 
    var transStr = 'translateX(' + displacement + 'px)';
    
    redMascot.style.setProperty('--mascot-trans', transStr);
    blueMascot.style.setProperty('--mascot-trans', transStr);
    
    redMascot.style.transform = transStr;
    blueMascot.style.transform = transStr;

    // Trigger pulling animation & dust particles on tap increment
    if (redTaps > prevRedTaps) {
      redMascot.classList.add('pulling');
      rope.classList.add('shaking');
      spawnDust(true);
      setTimeout(function() { redMascot.classList.remove('pulling'); }, 200);
      playCountdownBeep();
    }
    if (blueTaps > prevBlueTaps) {
      blueMascot.classList.add('pulling');
      rope.classList.add('shaking');
      spawnDust(false);
      setTimeout(function() { blueMascot.classList.remove('pulling'); }, 200);
      playCountdownBeep();
    }
    
    if (redTaps === prevRedTaps && blueTaps === prevBlueTaps) {
      rope.classList.remove('shaking');
    }

    prevRedTaps = redTaps;
    prevBlueTaps = blueTaps;

    // Update player rows
    var players = payload.players || [];
    var redPlayersSorted = players.filter(function(p) { return p.team === 'red'; }).sort(function(a,b) { return b.taps - a.taps; });
    var bluePlayersSorted = players.filter(function(p) { return p.team === 'blue'; }).sort(function(a,b) { return b.taps - a.taps; });

    players.forEach(function (player) {
      var tapsEl = document.getElementById('arena-taps-' + player.playerId);
      if (tapsEl) tapsEl.textContent = player.taps;

      var rowEl = document.getElementById('arena-row-' + player.playerId);
      if (rowEl) {
        rowEl.classList.remove('mvp');
        var nameSpan = rowEl.querySelector('.arena-player-name span');
        if (nameSpan) nameSpan.innerHTML = player.nickname;

        if (player.team === 'red' && redPlayersSorted[0] && redPlayersSorted[0].playerId === player.playerId && player.taps > 0) {
          rowEl.classList.add('mvp');
          if (nameSpan) nameSpan.innerHTML = '👑 ' + player.nickname;
        }
        if (player.team === 'blue' && bluePlayersSorted[0] && bluePlayersSorted[0].playerId === player.playerId && player.taps > 0) {
          rowEl.classList.add('mvp');
          if (nameSpan) nameSpan.innerHTML = '👑 ' + player.nickname;
        }
      }
    });
  }

  function onRaceOver(payload) {
    playFanfare();
    startConfetti();

    var winnerTeam = payload.winnerTeam; 
    var ranking = payload.ranking || [];
    var overlay = document.getElementById('winner-overlay');
    if (!overlay) {
      var div = document.createElement('div');
      div.id = 'winner-overlay';
      document.body.appendChild(div);
      overlay = div;
    }
    overlay.style.display = 'flex';
    
    var bannerClass = 'team-victory-banner ' + winnerTeam;
    var bannerText = '';
    if (winnerTeam === 'red') {
      bannerText = '🔴 RED TEAM WINS! 🔴';
    } else if (winnerTeam === 'blue') {
      bannerText = '🔵 BLUE TEAM WINS! 🔵';
    } else {
      bannerText = '🤝 IT\'S A TIE! 🤝';
    }

    overlay.innerHTML = 
      '<div class="winner-card" style="max-width: 580px;">' +
        '<h1 class="winner-title">🏁 MATCH RESULTS 🏁</h1>' +
        '<div class="' + bannerClass + '">' + bannerText + '</div>' +
        '<div style="margin: 28px 0; display: flex; justify-content: space-around; font-size: 24px; font-weight: 800; color: #854d0e;">' +
          '<div style="color: #ef4444; background: #fee2e2; padding: 12px 24px; border-radius: 16px; border: 3px solid #fca5a5; box-shadow: 0 4px 0 #fca5a5;">🔴 Red: ' + (payload.redTaps || 0) + ' taps</div>' +
          '<div style="color: #3b82f6; background: #dbeafe; padding: 12px 24px; border-radius: 16px; border: 3px solid #93c5fd; box-shadow: 0 4px 0 #93c5fd;">🔵 Blue: ' + (payload.blueTaps || 0) + ' taps</div>' +
        '</div>' +
        '<div class="restart-timer-line" id="restart-timer-line">Preparing new game room...</div>' +
      '</div>';

    document.getElementById('race-content').style.display = 'none';

    var statusEl = document.getElementById('status-line');
    statusEl.className = 'finished';
    statusEl.textContent = '🏁 Game Over! New room opening soon...';
  }

  function startConfetti() {
    var duration = 6000;
    var animationEnd = Date.now() + duration;
    var container = document.createElement('div');
    container.style.position = 'fixed';
    container.style.inset = '0';
    container.style.pointerEvents = 'none';
    container.style.zIndex = '999';
    document.body.appendChild(container);
    
    function randomInRange(min, max) { return Math.random() * (max - min) + min; }
    
    var interval = setInterval(function() {
      var timeLeft = animationEnd - Date.now();
      if (timeLeft <= 0) {
        clearInterval(interval);
        container.remove();
        return;
      }
      for (var i = 0; i < 6; i++) {
        var particle = document.createElement('div');
        particle.className = 'confetti-particle';
        particle.style.background = ['#ff007f', '#ffaa00', '#00ffaa', '#00aaff', '#cc00ff'][Math.floor(Math.random() * 5)];
        particle.style.left = randomInRange(0, 100) + '%';
        particle.style.top = '-10px';
        particle.style.width = randomInRange(8, 14) + 'px';
        particle.style.height = randomInRange(8, 14) + 'px';
        particle.style.opacity = randomInRange(0.6, 1);
        particle.style.transform = 'rotate(' + randomInRange(0, 360) + 'deg)';
        container.appendChild(particle);
        animateParticle(particle);
      }
    }, 100);

    function animateParticle(el) {
      var speedY = randomInRange(3, 7);
      var speedX = randomInRange(-1.5, 1.5);
      var spin = randomInRange(-8, 8);
      var top = -10;
      var left = parseFloat(el.style.left);
      var rotate = 0;
      var phaseOffset = Math.random() * 10;
      function step() {
        if (!el.parentNode) return;
        top += speedY;
        left += speedX + Math.sin((top / 25) + phaseOffset) * 0.45;
        rotate += spin;
        el.style.top = top + 'px';
        el.style.left = left + '%';
        el.style.transform = 'rotate(' + rotate + 'deg)';
        if (top < window.innerHeight) {
          requestAnimationFrame(step);
        } else {
          el.remove();
        }
      }
      requestAnimationFrame(step);
    }
  }

  function renderLobbyStatusLine() {
    var statusEl = document.getElementById('status-line');
    if (!statusEl) return;
    statusEl.className = 'lobby';
    if (lobbyPlayers.length === 0) {
      statusEl.textContent = '⏳ Waiting for players to scan QR code...';
    } else {
      statusEl.textContent = '👉 Ready! Press "Start Game Now" on TV to begin!';
    }
  }

  // Camera flashes simulator
  var flashInterval = null;
  function initCameraFlashes() {
    var container = document.getElementById('camera-flashes');
    if (!container) return;

    clearInterval(flashInterval);
    flashInterval = setInterval(function() {
      if (Math.random() > 0.45) {
        var dot = document.createElement('div');
        dot.className = 'flash-dot';
        dot.style.left = Math.random() * 100 + '%';
        dot.style.top = Math.random() * 40 + '%'; 
        container.appendChild(dot);
        
        var duration = Math.random() * 120 + 80;
        dot.style.transition = 'opacity ' + (duration / 2) + 'ms ease-out';
        setTimeout(function() {
          dot.style.opacity = '1';
          setTimeout(function() {
            dot.style.opacity = '0';
            setTimeout(function() { dot.remove(); }, duration / 2);
          }, 30);
        }, 10);
      }
    }, 150);
  }

  document.getElementById('btn-force-start').addEventListener('click', function () {
    send('force_start');
  });

  // D-Pad navigation
  var focusableIds = ['audio-toggle', 'btn-force-start'];
  window.addEventListener('keydown', function (e) {
    var active = document.activeElement;
    var activeId = active ? active.id : '';

    if (!active || focusableIds.indexOf(activeId) === -1) {
      var audioBtn = document.getElementById('audio-toggle');
      if (audioBtn) audioBtn.focus();
      return;
    }

    var nextId = null;
    var forceStartBtn = document.getElementById('btn-force-start');
    var canFocusStart = forceStartBtn && !forceStartBtn.disabled;

    switch (e.key) {
      case 'ArrowDown':
      case 'Down':
        if (activeId === 'audio-toggle' && canFocusStart) {
          nextId = 'btn-force-start';
        }
        break;
      case 'ArrowUp':
      case 'Up':
        if (activeId === 'btn-force-start') {
          nextId = 'audio-toggle';
        }
        break;
    }

    if (nextId) {
      var nextEl = document.getElementById(nextId);
      if (nextEl) {
        e.preventDefault();
        nextEl.focus();
      }
    }
  });

  connect();

  setTimeout(function () {
    var btn = document.getElementById('audio-toggle');
    if (btn) btn.focus();
  }, 1000);
}());
</script>
</body>
</html>
